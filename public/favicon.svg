<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Icône d'onglet : le logo or sur fond bleu nuit, traits épaissis et pointillés
       pleins pour rester lisible à 16 pixels. Le logo de référence est public/logo-or.svg. -->
  <defs>
    <linearGradient id="or" x1="14" y1="8" x2="82" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e39a"/>
      <stop offset="0.5" stop-color="#e0b650"/>
      <stop offset="1" stop-color="#c0902f"/>
    </linearGradient>
    <g id="branche">
      <rect x="47" y="24" width="6" height="26"/>
      <circle cx="50" cy="17" r="9" fill="none" stroke="#fff" stroke-width="6"/>
    </g>
    <mask id="figure" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <g fill="#fff">
        <use href="#branche"/>
        <use href="#branche" transform="rotate(60 50 50)"/>
        <use href="#branche" transform="rotate(120 50 50)"/>
        <use href="#branche" transform="rotate(180 50 50)"/>
        <use href="#branche" transform="rotate(240 50 50)"/>
        <use href="#branche" transform="rotate(300 50 50)"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="100" rx="16" fill="#0f1d3a"/>
  <rect width="100" height="100" fill="url(#or)" mask="url(#figure)"/>
</svg>
